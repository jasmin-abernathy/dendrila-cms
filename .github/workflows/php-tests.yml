name: PHP tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'bin/**'
      - 'database/migrations/**'
      - 'composer.json'
      - '.github/workflows/php-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'bin/**'
      - 'database/migrations/**'
      - 'composer.json'
      - '.github/workflows/php-tests.yml'

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test
      - run: composer lint
