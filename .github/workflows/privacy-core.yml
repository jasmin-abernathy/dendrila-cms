name: Native privacy core

on:
  push:
    branches: ['work/native-privacy-*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Auth/**'
      - 'src/Installation/**'
      - 'src/Runtime/**'
      - 'src/BackOffice/**'
      - 'public/**'
      - 'bootstrap.php'
      - 'bin/prepare-install.php'
      - 'database/migrations/**'
      - 'tests/install*'
      - 'src/Media/**'
      - 'src/Http/**'
      - 'src/Api/**'
      - 'src/Storage/PdoCmsStore.php'
      - 'public/media.php'
      - 'public/index.php'
      - 'public/admin/media-library/**'
      - 'database/migrations/007_media.sql'
      - 'database/migrations/008_media_revision.sql'
      - 'database/migrations/009_auth_rate_limits.sql'
      - 'tests/media*'
      - 'tests/media-web-ui.js'
      - 'tests/identity-pdo-run.php'
      - 'bin/identity-preflight.php'
      - 'bin/*media*.php'
      - 'src/Navigation/**'
      - 'src/Front/PdoPublicNavigationSource.php'
      - 'src/Front/PublicNavigationSource.php'
      - 'database/migrations/005_navigation.sql'
      - 'tests/navigation-run.php'
      - 'tests/navigation-pdo-run.php'
      - 'src/Seo/**'
      - 'src/Front/PdoPublicSeoSource.php'
      - 'src/Front/PublicSeoSource.php'
      - 'database/migrations/006_seo.sql'
      - 'tests/seo-run.php'
      - 'tests/seo-pdo-run.php'
      - 'composer.json'
      - '.github/workflows/privacy-core.yml'

permissions:
  contents: read

concurrency:
  group: native-privacy-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: privacy-test-only
          MARIADB_DATABASE: cms_privacy_test
          MARIADB_USER: cms_test
          MARIADB_PASSWORD: privacy-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=cms_privacy_test;charset=utf8mb4
      DB_USERNAME: cms_test
      DB_PASSWORD: privacy-test-only
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, gd, fileinfo, sodium, ctype
          tools: composer:v2
          coverage: none
          ini-values: error_reporting=E_ALL, display_errors=On
      - name: Install and verify PHP 8.5
        run: |
          php --version
          composer install --no-interaction --prefer-dist
      - name: Lint and contract tests
        run: |
          composer lint
          composer test
      - name: Validate consent JavaScript
        run: node --check public/assets/privacy-consent.js
      - name: Prepare a site that predates Privacy
        run: php tests/privacy-pdo-fixture.php
      - name: Apply Privacy migration through the real migrator
        run: php bin/migrate.php
      - name: Bootstrap a new site after Privacy migration
        run: php bin/bootstrap-site.php site-native "Native Privacy" owner-native false
      - name: PDO migration and isolation tests
        run: php tests/privacy-pdo-run.php
      - name: Navigation PDO contract
        run: php tests/navigation-pdo-run.php
      - name: SEO PDO contract
        run: php tests/seo-pdo-run.php
      - name: Forum PDO and photo checks
        run: php tests/forum-pdo-run.php
      - name: Bootstrap WordPress import test site
        run: php bin/bootstrap-site.php site-import "Imported Privacy" owner-import false
      - name: Import WordPress Dendrila Privacy twice
        run: |
          php bin/import-wordpress-privacy.php site-import owner-import tests/fixtures/wordpress-privacy-export.json
          php bin/import-wordpress-privacy.php site-import owner-import tests/fixtures/wordpress-privacy-export.json
      - name: WordPress privacy import persistence tests
        run: php tests/privacy-wordpress-import-pdo-run.php
      - name: Media PDO and multipart contracts
        run: php tests/media-pdo-run.php
      - name: Media web interface contracts
        run: |
          node --check public/admin/media-library/media-library-core.js
          node --check public/admin/media-library/media-library.js
          node tests/media-web-ui.js
      - name: Pilot identity bridge contracts
        run: php tests/identity-pdo-run.php
      - name: Verify migrations are idempotent
        run: php bin/migrate.php

      - name: Prepare isolated installation databases
        env:
          DB_USERNAME: root
        run: |
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306", "root", getenv("DB_PASSWORD")); $p->exec("CREATE DATABASE cms_install_test CHARACTER SET utf8mb4; CREATE DATABASE cms_browser_test CHARACTER SET utf8mb4");'
      - name: Native installation, accounts and publication PDO tests
        env:
          DB_USERNAME: root
          INSTALL_DB_NAME: cms_install_test
          INSTALL_DB_PORT: '3306'
        run: php tests/install-pdo-run.php
      - name: Install browser for end-to-end checks
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Installation and editing in a real browser
        env:
          APP_ENV: local
          DB_USERNAME: root
          INSTALL_DB_PORT: '3306'
        run: |
          env -u DB_DSN -u DB_USERNAME -u DB_PASSWORD php -S 127.0.0.1:8080 -t public public/router.php > /tmp/dendrila-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/dendrila-http.log' EXIT
          node tests/install-browser.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installation-browser
          path: build/test-artifacts/*.png
          if-no-files-found: ignore
